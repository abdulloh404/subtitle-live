[package]
name = "subtitle-live"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local Ubuntu live subtitles for selected PipeWire audio streams"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_6", "v1_1"] }
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_6"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
